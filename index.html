<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="mode-label" id="modeLabel">集中</div>
    <div class="timer" id="timer">25:00</div>
    <div class="controls">
      <button id="startBtn" class="btn btn-primary">スタート</button>
      <button id="resetBtn" class="btn btn-secondary">リセット</button>
    </div>
    <div class="session-count">セッション: <span id="sessionCount">0</span></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
